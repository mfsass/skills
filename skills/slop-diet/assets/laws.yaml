# 20 Principles of UX and Animation — Machine-Readable Law Table
# Shared source of truth for deterministic probes (slop-lint.mjs / ui-eval.mjs)
# and the cold visual reviewer (agents/reviewer.md).

version: "1.0.0"
laws:
  # ── 12 Animation Principles Adapted to Web UI ──
  - id: LAW-01
    number: 1
    category: animation
    name: Squash and stretch
    probe_type: code
    rule_id: UX-PRESS-STATE
    threshold: ":active scale(0.96-0.98) on tactile interactive controls"
    exception: "Static text links or disabled controls"
    observable_check: "Pressed buttons show crisp compression without distorting typography."

  - id: LAW-02
    number: 2
    category: animation
    name: Anticipation wind-up
    probe_type: judge
    threshold: "30-60ms micro-press or focus lead before major modal or panel launch"
    exception: "Instant keyboard navigation or reduced-motion mode"
    observable_check: "Major transitions feel initiated by user action, not abrupt teleportation."

  - id: LAW-03
    number: 3
    category: animation
    name: Staging the focus
    probe_type: judge
    threshold: "One primary focal area per viewport; secondary surfaces dim or recede on overlay"
    exception: "Multi-pane expert dashboards where simultaneous side-by-side comparison is the task"
    observable_check: "The user's eye lands on the intended focal action in under 1 second."

  - id: LAW-04
    number: 4
    category: animation
    name: Pose to pose
    probe_type: judge
    threshold: "Explicit resting, hover, focus, active, loading, empty, and error states defined"
    exception: "Static informational marketing sections"
    observable_check: "Every interactive control and async container renders intentional key states."

  - id: LAW-05
    number: 5
    category: animation
    name: Follow through
    probe_type: judge
    threshold: "Staggered children settle 30-80ms apart (80ms is the ceiling) after the parent surface stops (see references/craft-floor.md)"
    exception: "Dense operational tables or reduced-motion mode"
    observable_check: "Drawer and card content settles cleanly after the container lands."

  - id: LAW-06
    number: 6
    category: animation
    name: Slow in and slow out
    probe_type: judge
    threshold: "Ease-out for entrances, exits and state changes, e.g. cubic-bezier(.2,.8,.2,1) (see references/craft-floor.md)"
    exception: "Continuous progress bars or linear scrubbers"
    observable_check: "No robotic linear easing on UI drawers, cards, or popovers."

  - id: LAW-07
    number: 7
    category: animation
    name: Moving in arcs
    probe_type: judge
    threshold: "Slight vertical lift or curved path during two-axis drag or floating transitions"
    exception: "Single-axis horizontal tabs or vertical list reorders"
    observable_check: "Dragged cards and floating reveals follow natural spatial arcs."

  - id: LAW-08
    number: 8
    category: animation
    name: Secondary action
    probe_type: judge
    threshold: "At most one subordinate supporting micro-cue (such as a copy checkmark stroke)"
    exception: "High-frequency data entry where extra motion slows the operator"
    observable_check: "Supporting feedback reinforces the primary action without competing for attention."

  - id: LAW-09
    number: 9
    category: animation
    name: Snappy timing
    probe_type: code
    rule_id: UX-DOHERTY-DURATION
    threshold: "120-220ms hover/focus and state changes; overlays per the surface table; 300-600ms on-load entrance (see references/craft-floor.md)"
    exception: "Explicit storytelling showcase scroll scenes"
    observable_check: "Zero sluggish CSS transitions exceeding 600ms on UI controls."

  - id: LAW-10
    number: 10
    category: animation
    name: Exaggerated feedback
    probe_type: judge
    threshold: "Unmistakable confirmation on copy/save or tight 200ms error cue on failed submit"
    exception: "Silent background auto-save indicators"
    observable_check: "Users immediately know whether an action succeeded, failed, or is still running."

  - id: LAW-11
    number: 11
    category: animation
    name: Solid drawing in 3D
    probe_type: judge
    threshold: "Consistent perspective origin, light direction, and GPU-only transform properties"
    exception: "Flat operational dashboards that intentionally stay 2D"
    observable_check: "3D hero stages or tilted cards feel solid and hardware-smooth without layout thrash."

  - id: LAW-12
    number: 12
    category: animation
    name: Overall appeal
    probe_type: judge
    threshold: "Motion tone matches domain personality and respects prefers-reduced-motion"
    exception: "None (prefers-reduced-motion fallback is always required)"
    observable_check: "Motion adds distinctive polish without feeling gimmicky or slowing work."

  # ── 8 Core UX Laws ──
  - id: LAW-13
    number: 13
    category: ux
    name: Fitts's law
    probe_type: code
    rule_id: UX-FITTS-TARGET
    threshold: "Primary actions placed near pointer/thumb flow and sized proportionally"
    exception: "Destructive actions deliberately placed away from routine confirm buttons"
    observable_check: "Primary CTA and frequent workflow controls require minimal pointer travel."

  - id: LAW-14
    number: 14
    category: ux
    name: Bigger hit areas
    probe_type: code
    rule_id: UX-FITTS-TARGET
    threshold: ">= 44x44px for every tappable element"
    exception: "Inline prose hyperlinks inside paragraphs"
    observable_check: "Rendered interactive bounding boxes pass target-size probes at desktop and mobile."

  - id: LAW-15
    number: 15
    category: ux
    name: Hick's law
    probe_type: code
    rule_id: UX-HICK-NAV
    threshold: "<= 7 top-level nav links; <= 1 primary + 1 secondary CTA per viewport section"
    exception: "Complex documentation sidebars grouped into collapsible sections"
    observable_check: "Top navigation and hero choices stay focused without competing buttons."

  - id: LAW-16
    number: 16
    category: ux
    name: Miller's law
    probe_type: judge
    threshold: "3-5 related items per visual group separated by spacing before borders"
    exception: "Sortable reference tables where row scanning is the primary job"
    observable_check: "Metrics, cards, and form sections chunk cleanly into scannable groups."

  - id: LAW-17
    number: 17
    category: ux
    name: Doherty threshold
    probe_type: code
    rule_id: UX-DOHERTY-DURATION
    threshold: "< 100ms acknowledgement; < 400ms state transition or optimistic/skeleton feedback"
    exception: "External batch jobs that display explicit elapsed progress"
    observable_check: "Interface responds immediately on click and never hangs silently."

  - id: LAW-18
    number: 18
    category: ux
    name: Postel's law
    probe_type: code
    rule_id: UX-FORM-PLACEHOLDER-ONLY
    threshold: "Visible labels above fields, liberal input normalization, clear inline recovery hints"
    exception: "Single search inputs paired with an explicit icon and aria-label"
    observable_check: "Forms accept varied formatting gracefully and guide recovery beside the field."

  - id: LAW-19
    number: 19
    category: ux
    name: Jakob's law
    probe_type: code
    rule_id: UX-CLICKABLE-DIV
    threshold: "Native <button>/<a> semantics, familiar nav/tab/modal patterns, standard shortcuts"
    exception: "Canvas-based creative tools where custom direct manipulation is the domain"
    observable_check: "Zero clickable <div> anti-patterns; controls behave as platform users expect."

  - id: LAW-20
    number: 20
    category: ux
    name: Frequency of use
    probe_type: judge
    threshold: "Top 20% routine actions visible upfront; rare or destructive actions tucked away"
    exception: "Emergency kill-switches in safety-critical tools"
    observable_check: "High-frequency controls sit at top level while infrequent settings stay out of the way."
